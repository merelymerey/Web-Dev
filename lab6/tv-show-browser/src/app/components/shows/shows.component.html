<div class="shows-container">
  <h1>TV Shows</h1>

  <div class="search-bar">
    <input type="text" [(ngModel)]="searchQuery" placeholder="Search shows..." (keyup.enter)="search()" />
    <button class="btn-search" (click)="search()">Search</button>
    <button class="btn-clear" (click)="clearSearch()">Clear</button>
  </div>

  <p class="loading" *ngIf="loading">Loading...</p>

  <p class="empty" *ngIf="!loading && shows.length === 0">No shows found.</p>

  <div class="show-grid" *ngIf="!loading && shows.length > 0">
    <div class="show-card" *ngFor="let show of shows" (click)="goToDetail(show.id)">
      <img *ngIf="show.image" [src]="show.image.medium" [alt]="show.name" />
      <div *ngIf="!show.image" class="no-image">No Image</div>
      <div class="card-info">
        <strong>{{ show.name }}</strong>
        <span>{{ show.genres.join(', ') || 'N/A' }}</span>
        <span>Rating: {{ show.rating.average ?? 'N/A' }}</span>
        <span>Status: {{ show.status }}</span>
      </div>
    </div>
  </div>
</div>
